[workspace]
members = [
    "services/auth_service",
    "services/parser_service",
    "services/analysis_service",
    "services/ml_ranker_service",
    "services/suggestion_generator_service",
    "services/api_gateway",
    # "cli/repo-optimizer-cli",  # TODO: re-enable kada krenemo na CLI (zajedno sa frontend-om)
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Milan Lazarevic <milan.lazarevic03@gmail.com>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.37", features = ["full"] }
axum = { version = "0.7", features = ["macros", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
mongodb = "3.1"
bson = { version = "2.9", features = ["chrono-0_4", "uuid-1"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
